<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon TCG Universal Simulator</title>
    <style>
        :root {
            --primary: #3b4cca;
            --secondary: #ffde00;
            --background: #1a1a1a;
            --text: #ffffff;
            --accent: #4CAF50;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        nav {
            margin-bottom: 20px;
        }
        /* New styling for the set selector to match your UI */
        select {
            background-color: #2a2a2a;
            color: white;
            border: 2px solid var(--primary);
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            outline: none;
        }
        select:focus {
            border-color: var(--secondary);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: 2px solid var(--secondary);
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:disabled {
            background-color: #555;
            border-color: #333;
            cursor: not-allowed;
            transform: none;
        }
        #status-message {
            color: var(--secondary);
            font-weight: bold;
            margin-bottom: 10px;
            min-height: 20px;
        }
        #dashboard {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid #444;
        }
        #dashboard h3 {
            margin: 0;
            color: var(--secondary);
        }
        #total-value {
            color: var(--accent);
        }
        
        /* Collection Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card-grid img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card-grid img:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 8px 16px rgba(255, 222, 0, 0.4);
        }

        /* 3D Flip Card CSS */
        .flip-card {
            background-color: transparent;
            width: 300px;
            height: 418px;
            perspective: 1000px;
            margin: 0 auto;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .flip-card.revealed .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .flip-card-front img, .flip-card-back img {
            width: 100%;
            height: 100%;
            border-radius: 15px;
            object-fit: cover;
        }
        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* Animations & Helpers */
        .price-tag {
            font-size: 28px;
            color: var(--accent);
            font-weight: bold;
            margin: 20px 0;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>Universal Pokémon Pack Simulator</h1>
    
    <div id="dashboard">
        <h3>Total Collection Value: <span id="total-value">$0.00</span></h3>
    </div>

    <nav>
        <select id="set-select" onchange="loadCardsForSet()">
            <option value="">Loading Sets...</option>
        </select>
        
        <button id="nav-pack" onclick="switchView('pack')">Open Packs</button>
        <button id="nav-collection" onclick="switchView('collection')">My Collection</button>
    </nav>

    <div id="status-message">Initializing API...</div>

    <div id="view-pack">
        <button id="btn-open" onclick="openPack()" disabled>Open a Pack (10 Cards)</button>
        
        <div id="pack-opener-view" class="hidden">
            <h2 id="pack-counter">Card 1 of 10</h2>
            <div id="single-card-display"></div>
        </div>
    </div>

    <div id="view-collection" class="hidden">
        <h2>Collection for Current Set (<span id="collection-count">0</span> cards)</h2>
        <button onclick="clearCurrentSetCollection()" style="background-color: #cc0000; font-size: 12px; border-color: #aa0000;">Reset THIS Set's Collection</button>
        <div id="collection-display" class="card-grid"></div>
    </div>

    <script>
        // --- 1. GAME STATE & DATA ---
        let currentSetCards = []; // Cards for the currently selected set
        let currentPackCards = [];
        let currentCardIndex = 0;

        // Load saved data from browser (now structured as an object of arrays mapped by set ID)
        let playerCollections = JSON.parse(localStorage.getItem('pokemonSetCollections')) || {};
        let totalValue = parseFloat(localStorage.getItem('pokemonTotalValue')) || 0;

        const SETS_API_URL = 'https://api.pokemontcg.io/v2/sets?orderBy=-releaseDate';
        const CARDS_API_URL = 'https://api.pokemontcg.io/v2/cards?q=set.id:';
        const CARD_BACK_URL = 'https://upload.wikimedia.org/wikipedia/en/3/3b/Pokemon_Trading_Card_Game_cardback.jpg';

        // Initialize dashboard
        updateValueDisplay();

        // --- 2. INITIALIZATION (FETCH SETS) ---
        async function fetchSets() {
            try {
                const response = await fetch(SETS_API_URL);
                const data = await response.json();
                
                const selectElement = document.getElementById('set-select');
                selectElement.innerHTML = ''; // Clear loading text
                
                // Populate dropdown with all sets
                data.data.forEach(set => {
                    const option = document.createElement('option');
                    option.value = set.id;
                    option.innerText = set.name;
                    selectElement.appendChild(option);
                });

                // Load the first set automatically
                loadCardsForSet();
                
            } catch (error) {
                document.getElementById('status-message').innerText = "Error loading sets from API.";
                console.error(error);
            }
        }

        // --- 3. LOAD CARDS FOR SPECIFIC SET ---
        async function loadCardsForSet() {
            const setId = document.getElementById('set-select').value;
            if (!setId) return;

            document.getElementById('status-message').innerText = "Loading set data...";
            document.getElementById('btn-open').disabled = true;

            try {
                // Fetch all cards that belong to the selected set ID
                const response = await fetch(CARDS_API_URL + setId + '&pageSize=250');
                const data = await response.json();
                
                currentSetCards = data.data;
                
                const setName = document.getElementById('set-select').options[document.getElementById('set-select').selectedIndex].text;
                document.getElementById('status-message').innerText = `${setName} loaded! Ready to open packs.`;
                document.getElementById('btn-open').disabled = false;
                
                updateCollectionCount();
                
                // If user is currently looking at the collection menu, re-render it for the new set
                if (!document.getElementById('view-collection').classList.contains('hidden')) {
                    renderCollection();
                }

            } catch (error) {
                document.getElementById('status-message').innerText = "Error loading cards for this set.";
                console.error(error);
            }
        }

        // --- 4. PACK OPENING LOGIC ---
        function getWeightForRarity(rarity) {
            if (!rarity) return 200; 
            const r = rarity.toLowerCase();
            if (r.includes('secret') || r.includes('hyper') || r.includes('special illustration')) return 1;
            if (r.includes('ultra') || r.includes('vmax') || r.includes('vstar') || r.includes('illustration') || r.includes('legend')) return 4;
            if (r.includes('rare')) return 15;
            if (r.includes('uncommon')) return 60;
            if (r.includes('common')) return 200;
            return 20; 
        }

        function getRandomCardWeighted(pool) {
            let totalWeight = 0;
            const weights = pool.map(card => {
                const weight = getWeightForRarity(card.rarity);
                totalWeight += weight;
                return weight;
            });

            let randomVal = Math.random() * totalWeight;
            for (let i = 0; i < pool.length; i++) {
                randomVal -= weights[i];
                if (randomVal <= 0) {
                    return pool[i];
                }
            }
            return pool[Math.floor(Math.random() * pool.length)]; 
        }

        function openPack() {
            if (currentSetCards.length === 0) return;
            
            currentPackCards = [];
            for (let i = 0; i < 10; i++) {
                // Pull heavily weighted odds from the CURRENT set only
                currentPackCards.push(getRandomCardWeighted(currentSetCards));
            }
            
            currentCardIndex = 0;
            document.getElementById('btn-open').classList.add('hidden');
            document.getElementById('pack-opener-view').classList.remove('hidden');
            document.getElementById('status-message').innerText = "Click the card to reveal it!";
            
            renderSingleCard();
        }

        function renderSingleCard() {
            const card = currentPackCards[currentCardIndex];
            const displayArea = document.getElementById('single-card-display');
            
            document.getElementById('pack-counter').innerText = `Card ${currentCardIndex + 1} of 10`;
            
            displayArea.innerHTML = `
                <div class="flip-card" onclick="revealCard(this)">
                    <div class="flip-card-inner">
                        <div class="flip-card-front">
                            <img src="${CARD_BACK_URL}" alt="Card Back">
                        </div>
                        <div class="flip-card-back">
                            <img src="${card.images.large || card.images.small}" alt="${card.name}">
                        </div>
                    </div>
                </div>
                <div id="card-price" class="hidden price-tag"></div>
                <br>
                <button id="btn-next" class="hidden" onclick="nextCard()">Next Card</button>
            `;
        }

        // --- 5. CARD REVEAL & VALUE CALCULATION ---
        function getCardPrice(card) {
            if (card.tcgplayer && card.tcgplayer.prices) {
                const prices = card.tcgplayer.prices;
                if (prices.holofoil && prices.holofoil.market) return prices.holofoil.market;
                if (prices.normal && prices.normal.market) return prices.normal.market;
                if (prices['1stEditionHolofoil'] && prices['1stEditionHolofoil'].market) return prices['1stEditionHolofoil'].market;
                if (prices.reverseHolofoil && prices.reverseHolofoil.market) return prices.reverseHolofoil.market;
                
                for (let key in prices) {
                    if (prices[key].market) return prices[key].market;
                }
            }
            return 0.00; 
        }

        function revealCard(element) {
            if (element.classList.contains('revealed')) return; 
            
            element.classList.add('revealed');
            const card = currentPackCards[currentCardIndex];
            const setId = document.getElementById('set-select').value;
            
            // Calculate and add price
            const price = getCardPrice(card);
            totalValue += price;
            
            // Add to permanent collection mapped by specific SET ID
            if (!playerCollections[setId]) {
                playerCollections[setId] = [];
            }
            
            playerCollections[setId].push({
                id: card.id,
                name: card.name,
                image: card.images.small,
                price: price
            });
            
            saveData();
            updateValueDisplay();

            setTimeout(() => {
                const priceTag = document.getElementById('card-price');
                priceTag.innerText = `Value: $${price.toFixed(2)}`;
                priceTag.classList.remove('hidden');
                
                const btnNext = document.getElementById('btn-next');
                btnNext.innerText = (currentCardIndex < 9) ? "Next Card" : "Finish Pack";
                btnNext.classList.remove('hidden');
                
                document.getElementById('status-message').innerText = "";
            }, 600);
        }

        function nextCard() {
            currentCardIndex++;
            if (currentCardIndex < 10) {
                renderSingleCard(); 
            } else {
                document.getElementById('pack-opener-view').classList.add('hidden');
                document.getElementById('btn-open').classList.remove('hidden');
                document.getElementById('status-message').innerText = "Pack completed! Open another?";
            }
        }

        // --- 6. DATA MANAGEMENT & UI ---
        function saveData() {
            localStorage.setItem('pokemonSetCollections', JSON.stringify(playerCollections));
            localStorage.setItem('pokemonTotalValue', totalValue);
            updateCollectionCount();
        }

        function updateValueDisplay() {
            document.getElementById('total-value').innerText = `$${totalValue.toFixed(2)}`;
        }

        function updateCollectionCount() {
            const setId = document.getElementById('set-select').value;
            const currentSetCollection = playerCollections[setId] || [];
            document.getElementById('collection-count').innerText = currentSetCollection.length;
        }

        function recalculateTotalValue() {
            let total = 0;
            for (const setId in playerCollections) {
                playerCollections[setId].forEach(card => {
                    total += card.price;
                });
            }
            totalValue = total;
            saveData();
            updateValueDisplay();
        }

        function clearCurrentSetCollection() {
            const setId = document.getElementById('set-select').value;
            const setName = document.getElementById('set-select').options[document.getElementById('set-select').selectedIndex].text;
            
            if(confirm(`Are you sure you want to delete your entire collection for ${setName}?`)) {
                playerCollections[setId] = [];
                recalculateTotalValue(); // Fixes the global value to remove only this set's worth
                renderCollection();
                updateCollectionCount();
            }
        }

        function switchView(view) {
            document.getElementById('view-pack').className = view === 'pack' ? '' : 'hidden';
            document.getElementById('view-collection').className = view === 'collection' ? '' : 'hidden';
            
            if (view === 'collection') {
                renderCollection();
            }
        }

        function renderCollection() {
            const setId = document.getElementById('set-select').value;
            const currentSetCollection = playerCollections[setId] || [];
            
            const collectionDisplay = document.getElementById('collection-display');
            collectionDisplay.innerHTML = '';

            const displayList = [...currentSetCollection].reverse(); 

            if (displayList.length === 0) {
                collectionDisplay.innerHTML = "<p>Your collection for this set is empty.</p>";
                return;
            }

            displayList.forEach(card => {
                const img = document.createElement('img');
                img.src = card.image;
                img.alt = card.name;
                img.title = `${card.name} - $${card.price.toFixed(2)}`; 
                collectionDisplay.appendChild(img);
            });
        }

        // Start the engine
        fetchSets();
    </script>
</body>
</html>
